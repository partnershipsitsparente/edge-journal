<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EDGE — Trading Journal</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #05050a;
      --bg2:     #111118;
      --bg3:     #1a1a24;
      --text:    #e8e8f0;
      --muted:   #888898;
      --accent:  #9B7FFF;
      --green:   #00d084;
      --red:     #ff4d4d;
      --amber:   #f5a623;
      --mono:    'Geist Mono', monospace;
      --r:       12px;
    }

    body {
      font-family: 'Geist', sans-serif;
      background: #05050a;
      color: var(--text);
      min-height: 100vh;
      overflow: hidden;
    }

    /* LOGIN SCREEN */
    #login-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #05050a;
      z-index: 9999;
    }

    #login-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .login-inner {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      text-align: center;
    }

    .login-logo {
      font-family: 'Syne', sans-serif;
      font-size: 48px;
      font-weight: 800;
      letter-spacing: -2px;
      color: #fff;
    }

    .login-logo span { color: var(--accent); }

    .login-sub {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: .14em;
      text-transform: uppercase;
      margin-top: 0;
    }

    .login-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #fff;
      color: #111;
      border: none;
      border-radius: 14px;
      padding: 15px 32px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Geist', sans-serif;
      box-shadow: 0 4px 32px rgba(0,0,0,0.5);
      transition: transform .15s, box-shadow .15s;
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 40px rgba(0,0,0,0.6);
    }

    /* APP SHELL (empty for now) */
    #app-shell {
      display: none;
      width: 100%;
      height: 100vh;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
    }

    .welcome-title {
      font-family: 'Syne', sans-serif;
      font-size: 32px;
      font-weight: 800;
      color: var(--text);
    }

    .welcome-sub {
      font-size: 14px;
      color: var(--muted);
    }

    .welcome-user {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg2);
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 12px;
      padding: 12px 20px;
      font-size: 14px;
    }

    .welcome-user img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
    }

    .signout-btn {
      background: transparent;
      border: 1px solid rgba(255,255,255,.1);
      color: var(--muted);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
      transition: all .15s;
    }

    .signout-btn:hover { border-color: var(--red); color: var(--red); }
  </style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="login-screen">
  <canvas id="login-canvas"></canvas>
  <div class="login-inner">
    <div style="display:flex;flex-direction:column;align-items:center;gap:12px">
      <div class="login-logo">EDGE<span>.</span></div>
      <div class="login-sub">Trading Journal</div>
    </div>
    <button class="login-btn" onclick="window._fbSignIn()">
      <svg width="20" height="20" viewBox="0 0 48 48">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Continue with Google
    </button>
  </div>
</div>

<!-- APP SHELL -->
<div id="app-shell">
  <div class="welcome-title">You're in.</div>
  <div class="welcome-sub">EDGE is being rebuilt. Check back soon.</div>
  <div class="welcome-user">
    <img id="user-avatar" src="" alt="">
    <span id="user-name"></span>
  </div>
  <button class="signout-btn" onclick="window._fbSignOut()">Sign out</button>
</div>

<!-- Firebase -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, doc, setDoc, getDoc } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyAf5OJTy6cMq19o6iJKwV5fzofUnBkvjPw",
  authDomain: "edge-journal-f3179.firebaseapp.com",
  projectId: "edge-journal-f3179",
  storageBucket: "edge-journal-f3179.firebasestorage.app",
  messagingSenderId: "641522580699",
  appId: "1:641522580699:web:4d9352cbb490399fa120fe",
  measurementId: "G-CBRPPGRXF4"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

let currentUser = null;

window._fbSignIn = async () => {
  try {
    await signInWithPopup(auth, provider);
  } catch(e) {
    alert('Sign-in failed: ' + e.message);
  }
};

window._fbSignOut = async () => {
  if (!confirm('Sign out?')) return;
  await signOut(auth);
};

window._fbSave = async (data) => {
  if (!currentUser) return;
  try {
    await setDoc(doc(db, 'users', currentUser.uid), data);
  } catch(e) { console.error('Save failed', e); }
};

window._fbLoad = async () => {
  if (!currentUser) return null;
  try {
    const snap = await getDoc(doc(db, 'users', currentUser.uid));
    return snap.exists() ? snap.data() : null;
  } catch(e) { return null; }
};

onAuthStateChanged(auth, async (user) => {
  currentUser = user;
  const loginScreen = document.getElementById('login-screen');
  const appShell = document.getElementById('app-shell');

  if (user) {
    document.getElementById('user-avatar').src = user.photoURL || '';
    document.getElementById('user-name').textContent = user.displayName || user.email;
    loginScreen.style.display = 'none';
    appShell.style.display = 'flex';
  } else {
    loginScreen.style.display = 'flex';
    appShell.style.display = 'none';
  }
});
</script>

<!-- Login canvas particle animation -->
<script>
(function() {
  const canvas = document.getElementById('login-canvas');
  const ctx = canvas.getContext('2d');
  let W, H, dots = [];
  let mx = -999, my = -999;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  function init() {
    dots = Array.from({length: 80}, () => ({
      x: Math.random() * W, y: Math.random() * H,
      vx: (Math.random() - .5) * .5, vy: (Math.random() - .5) * .5,
      r: Math.random() * 2 + 1,
      color: Math.random() > .5 ? '155,127,255' : '0,208,132',
      opacity: Math.random() * 0.5 + 0.4
    }));
  }

  window.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // Big cursor glow
    if (mx > 0) {
      const grad = ctx.createRadialGradient(mx, my, 0, mx, my, 200);
      grad.addColorStop(0, 'rgba(155,127,255,0.08)');
      grad.addColorStop(1, 'rgba(155,127,255,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);
    }

    dots.forEach(d => {
      // Attract dots toward cursor slightly
      const dx = mx - d.x, dy = my - d.y;
      const dist = Math.hypot(dx, dy);
      if (dist < 200 && dist > 0) {
        d.vx += (dx / dist) * 0.015;
        d.vy += (dy / dist) * 0.015;
      }
      // Speed limit
      const speed = Math.hypot(d.vx, d.vy);
      if (speed > 1.5) { d.vx = (d.vx/speed)*1.5; d.vy = (d.vy/speed)*1.5; }

      d.x += d.vx; d.y += d.vy;
      if (d.x < 0 || d.x > W) d.vx *= -1;
      if (d.y < 0 || d.y > H) d.vy *= -1;

      // Glow effect on dot
      const nearCursor = dist < 150;
      if (nearCursor) {
        ctx.shadowBlur = 8;
        ctx.shadowColor = 'rgba(' + d.color + ',0.8)';
      }
      ctx.beginPath();
      ctx.arc(d.x, d.y, nearCursor ? d.r * 1.5 : d.r, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(' + d.color + ',' + d.opacity + ')';
      ctx.fill();
      ctx.shadowBlur = 0;
    });

    // Lines between nearby dots
    for (let i = 0; i < dots.length; i++) {
      for (let j = i+1; j < dots.length; j++) {
        const a = dots[i], b = dots[j];
        const d = Math.hypot(a.x-b.x, a.y-b.y);
        if (d < 130) {
          ctx.beginPath();
          ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
          ctx.strokeStyle = 'rgba(155,127,255,' + (1 - d/130) * 0.25 + ')';
          ctx.lineWidth = 0.6;
          ctx.stroke();
        }
      }
      // Lines to cursor
      const cd = Math.hypot(dots[i].x-mx, dots[i].y-my);
      if (cd < 180) {
        ctx.beginPath();
        ctx.moveTo(dots[i].x, dots[i].y); ctx.lineTo(mx, my);
        ctx.strokeStyle = 'rgba(155,127,255,' + (1 - cd/180) * 0.5 + ')';
        ctx.lineWidth = 0.8;
        ctx.stroke();
      }
    }

    requestAnimationFrame(draw);
  }

  resize();
  init();
  draw();
  window.addEventListener('resize', () => { resize(); init(); });
})();
</script>

</body>
</html>
